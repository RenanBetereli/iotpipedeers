AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda Template

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Ambiente de deploy

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Connection string do Supabase/Postgres (injetada via secret do GitHub Actions)

  DataLakeBucketName:
    Type: String
    Default: jdf-data-lake-renan
    Description: Bucket S3 de origem dos eventos processados pela Lambda

Resources:
  MyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "supabaseConnectorV2-${Environment}"
      Runtime: python3.12
      Handler: supabaseConnectorV2.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl

      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "body": "Hello World"
              }

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "supabaseConnectorV2-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReadDataLakeObjects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DataLakeBucketName}/*"

Outputs:
  LambdaName:
    Value: !Ref MyLambda